name: Run Nolio POC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          NOLIO_TOKEN: ${{ secrets.NOLIO_TOKEN }}
        run: npm start

      - name: Upload workouts csv file
        uses: actions/upload-artifact@v4
        with:
          name: workouts-report
          path: workouts.csv
