name: Export Nolio Workouts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Nolio export script
        env:
          NOLIO_TOKEN: ${{ secrets.NOLIO_TOKEN }}
        run: node index.js

      - name: Commit and push exports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update Nolio workouts exports" || echo "No changes to commit"
          git pull origin main --rebase || git rebase --abort
          git push
          
