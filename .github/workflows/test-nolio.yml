name: Test API Nolio

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Nolio script
        env:
          NOLIO_TOKEN: ${{ secrets.NOLIO_TOKEN }}
        run: npm start
