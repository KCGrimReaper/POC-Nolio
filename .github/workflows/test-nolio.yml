name: Run Nolio POC

on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write  # <-- C'est cette ligne qui donne le droit de push au bot
  
jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          NOLIO_TOKEN: ${{ secrets.NOLIO_TOKEN }}
        run: npm start

      - name: Commit and push CSV report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add automatic workouts CSV export"
          file_pattern: "workouts_*.csv"
